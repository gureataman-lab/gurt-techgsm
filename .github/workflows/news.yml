name: Haberleri güncelle ve yayınla

on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  news:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Kaynaklardan haberleri al
        id: refresh
        continue-on-error: true
        run: python scripts/update_news.py
      - name: Son başarılı haberleri koru
        run: test -s data/news.json
      - name: Güncel haberleri depoda sakla
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/news.json
          if ! git diff --cached --quiet; then
            git commit -m 'Mobil haber akışını güncelle'
            git push origin HEAD:main
          fi
      - uses: actions/configure-pages@v5
      - name: Mevcut siteyi yayın için hazırla
        run: |
          mkdir _site
          cp index.html _site/
          cp -r assets data admin _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Kaynak hatasını bildir
        if: steps.refresh.outcome == 'failure'
        run: echo '::warning::Haber kaynaklarına ulaşılamadı; son başarılı haberler yayınlanıyor.'
  deploy:
    needs: news
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: GitHub Pages üzerinde yayınla
        id: deployment
        uses: actions/deploy-pages@v4
